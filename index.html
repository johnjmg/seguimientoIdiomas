<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Seguimiento de Aprendizaje de Idiomas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* estilos */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f4f7fb;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1400px;
            width: 100%;
        }
        h1, h2, h3 {
            color: #1e293b;
            margin: 0 0 12px 0;
            font-weight: 600;
        }
        .panel {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            border: 1px solid #e9eef3;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tab {
            background: #eef2f6;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .tab.active {
            background: #2d6a4f;
            color: white;
            border-color: #1b4b3b;
        }
        button, .btn {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #1b4b3b;
        }
        button.secondary {
            background: #64748b;
            border-color: #475569;
        }
        button.warning {
            background: #b91c1c;
            border-color: #7f1d1d;
        }
        button.warning:hover {
            background: #991b1b;
        }
        button.small {
            padding: 6px 14px;
            font-size: 0.85rem;
        }
        .week-nav {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 10px 16px;
            border-radius: 60px;
        }
        .reminder-panel {
            background: #fff3cd;
            border-left: 6px solid #ffc107;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 12px;
            display: none;
        }
        .reminder-panel a {
            color: #b45309;
            font-weight: bold;
            text-decoration: none;
        }
        .reminder-panel a:hover {
            text-decoration: underline;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 800px;
        }
        th {
            background: #f1f5f9;
            padding: 12px 6px;
            text-align: center;
            font-weight: 600;
            color: #334155;
        }
        td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .activity-cell {
            background: #f8fafc;
            font-weight: 500;
            text-align: left;
            padding-left: 12px;
            position: sticky;
            left: 0;
            background: white;
        }
        .checkbox-cell {
            background: #ffffff;
        }
        .time-input {
            width: 65px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            text-align: center;
            margin-top: 4px;
            font-size: 0.85rem;
        }
        .goal-met {
            background-color: #c8f0d9 !important;
        }
        .total-row {
            background: #f1f5f9;
            font-weight: 600;
        }
        .progress-bar {
            background: #e2e8f0;
            border-radius: 30px;
            height: 28px;
            width: 100%;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            background: #2d6a4f;
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 10px;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }
        .goal-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #dde3e9;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .stat-item {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 15px;
        }
        .calendar-day {
            aspect-ratio: 1;
            background: #f1f5f9;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            padding: 4px;
        }
        .calendar-day.has-data {
            background: #cbd5e1;
        }
        .calendar-day.goal-met-day {
            background: #a7f3d0;
        }
        .calendar-day-number {
            font-weight: 600;
        }
        .config-section {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 20px;
        }
        .activity-config {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            background: white;
            padding: 8px 12px;
            border-radius: 40px;
        }
        .activity-config.archived {
            opacity: 0.6;
            text-decoration: line-through;
            background: #f1f5f9;
        }
        .mobile-friendly {
            overflow-x: auto;
        }
        .export-import {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        .checkbox-marked {
            outline: 2px solid #3b82f6;
            outline-offset: -2px;
            border-radius: 8px;
        }
        .star-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: 4px;
            padding: 2px;
            color: #f59e0b;
        }
        .star-btn:hover {
            transform: scale(1.2);
        }
        @media (max-width: 700px) {
            .time-input {
                width: 55px;
                font-size: 0.8rem;
            }
            .day-check {
                transform: scale(1.2);
                margin: 0 4px;
            }
            .activity-cell {
                font-size: 0.85rem;
                white-space: normal;
            }
        }
    </style>
    <link rel="manifest" href="data:application/manifest+json,{...}">
</head>
<body>
<div class="container">
    <h1>🗓️ Seguimiento de Idiomas</h1>
    <div class="panel">
        <div class="flex-row">
            <div class="tabs" id="languageTabs"></div>
            <div class="export-import">
                <button id="exportBtn" class="secondary small">📤 Exportar</button>
                <button id="importBtn" class="secondary small">📥 Importar</button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
                <button id="addLangBtn" class="small">➕ Idioma</button>
                <button id="deleteLangBtn" class="small warning">🗑️ Eliminar idioma</button>
                <button id="fullCleanBtn" class="small warning" style="background:#b45309;">🧹 Limpieza total</button>
            </div>
        </div>
    </div>
    <div class="panel">
        <div class="week-nav">
            <button id="prevWeekBtn">◀</button>
            <span id="weekRange"></span>
            <button id="nextWeekBtn">▶</button>
            <input type="date" id="weekPicker" style="border-radius:30px; padding:6px 12px; border:1px solid #ccc;">
            <button id="goToTodayBtn" class="small secondary">📅 Hoy</button>
        </div>
        <div id="reminderPanel" class="reminder-panel">
            <strong>⚠️ Recordatorio</strong><br>
            <span id="reminderText"></span>
        </div>
    </div>
    <div class="panel mobile-friendly">
        <table id="weeklyTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
            <tfoot id="tableFoot"></tfoot>
        </table>
    </div>
    <div class="panel">
        <h2>📊 Estadísticas (idioma actual)</h2>
        <div class="stats-grid" id="statsContainer"></div>
    </div>
    <div class="panel">
        <div class="flex-row">
            <h2>📅 Calendario mensual</h2>
            <div>
                <select id="calendarMonthSelect"></select>
                <select id="calendarYearSelect"></select>
                <button id="syncCalendarBtn" class="small secondary">📅 Sincronizar con semana</button>
            </div>
        </div>
        <div class="calendar" id="calendarGrid"></div>
        <p style="font-size:0.85rem; color:#555;">Verde = día con meta de tiempo cumplida. ⭐ = objetivos del día cumplidos.</p>
    </div>
    <div class="panel">
        <h2>🎯 Metas a largo plazo</h2>
        <div class="goals-grid" id="longTermGoals"></div>
    </div>
    <div class="panel config-section">
        <h3>⚙️ Configurar <span id="currentLangName"></span></h3>
        <div id="activitiesConfig"></div>
        <div class="flex-row" style="margin-top:15px;">
            <button id="addActivityBtn" class="secondary small">➕ Añadir actividad</button>
            <button id="saveActivitiesBtn" class="small">Guardar cambios</button>
            <label style="margin-left:auto;">Unidad: 
                <select id="timeUnitSelect">
                    <option value="min">Minutos</option>
                    <option value="h">Horas</option>
                </select>
            </label>
        </div>
    </div>
    <footer>© <span id="currentYear"></span> John Jáner M.G - <a href="http://jmartech.com">jmartech.com</a></footer>
</div>

<script>
    (function() {
        let languages = [];
        let entries = {};
        let currentLangId = null;
        let currentWeekStart;
        let calendarYear, calendarMonth;
        const STORAGE_LANGS = 'langs_adv';
        const STORAGE_ENTRIES = 'entries_adv';

        // ---------- FUNCIONES DE FECHA LOCAL ----------
        function parseLocalDate(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        function getLocalDateString(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            d.setDate(d.getDate() - diff);
            return getLocalDateString(d);
        }

        function formatDateRange(mondayStr) {
            const monday = parseLocalDate(mondayStr);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            const format = (date) => date.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit' });
            const yearSuffix = sunday.getFullYear() !== monday.getFullYear() ? `/${sunday.getFullYear()}` : '';
            return `${format(monday)} - ${format(sunday)}${yearSuffix}`;
        }

        function generateId() { return Date.now() + '-' + Math.random().toString(36); }

        // ---------- CARGA Y GUARDADO ----------
        function loadData() {
            const storedLangs = localStorage.getItem(STORAGE_LANGS);
            if (storedLangs) {
                languages = JSON.parse(storedLangs);
                languages.forEach(lang => {
                    if (lang.activities) {
                        lang.activities.forEach(act => { if (act.active === undefined) act.active = true; });
                    }
                });
            } else {
                languages = [
                    { id: '1', name: 'Inglés', activities: [
                        { name: 'Vocabulario', dailyGoal: 30, active: true },
                        { name: 'Shadowing', dailyGoal: 20, active: true },
                        { name: 'Lectura y transcripción', dailyGoal: 30, active: true },
                        { name: 'Gramática', dailyGoal: 15, active: true },
                        { name: 'Escribir/hablar', dailyGoal: 20, active: true }
                    ], longTermGoal: { amount: 200, unit: 'min' }, timeUnit: 'min' },
                    { id: '2', name: 'Francés', activities: [
                        { name: 'Vocabulario', dailyGoal: 30, active: true },
                        { name: 'Escucha', dailyGoal: 30, active: true },
                        { name: 'Habla', dailyGoal: 30, active: true }
                    ], longTermGoal: { amount: 540, unit: 'h' }, timeUnit: 'h' }
                ];
            }
            const storedEntries = localStorage.getItem(STORAGE_ENTRIES);
            if (storedEntries) {
                entries = JSON.parse(storedEntries);
                for (let key in entries) {
                    const entry = entries[key];
                    if (entry.days) {
                        for (let day in entry.days) {
                            if (Array.isArray(entry.days[day])) {
                                const oldArray = entry.days[day];
                                const newObj = {};
                                const langId = key.split('_')[0];
                                const lang = languages.find(l => l.id === langId);
                                if (lang && lang.activities) {
                                    lang.activities.forEach((act, idx) => {
                                        if (oldArray[idx]) newObj[act.name] = { ...oldArray[idx], isGoal: false };
                                    });
                                }
                                entry.days[day] = newObj;
                            } else {
                                Object.values(entry.days[day]).forEach(cell => { if (cell.isGoal === undefined) cell.isGoal = false; });
                            }
                        }
                    }
                }
                saveEntries();
            } else {
                entries = {};
            }
            if (languages.length > 0 && !currentLangId) currentLangId = languages[0].id;
            // Inicializar currentWeekStart con la semana actual local
            if (!currentWeekStart) currentWeekStart = getMonday(new Date());
            // Inicializar calendario
            const now = new Date();
            calendarYear = now.getFullYear();
            calendarMonth = now.getMonth();
        }

        function saveLanguages() { localStorage.setItem(STORAGE_LANGS, JSON.stringify(languages)); }
        function saveEntries() { localStorage.setItem(STORAGE_ENTRIES, JSON.stringify(entries)); }

        function getCurrentEntry() {
            const key = `${currentLangId}_${currentWeekStart}`;
            if (!entries[key]) {
                const days = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
                const daysData = {};
                days.forEach(day => { daysData[day] = {}; });
                entries[key] = { weekStart: currentWeekStart, days: daysData };
            }
            return entries[key];
        }

        function updateCell(day, actName, checked, time, isGoal) {
            const entry = getCurrentEntry();
            if (!entry.days[day]) entry.days[day] = {};
            if (!entry.days[day][actName]) entry.days[day][actName] = { checked: false, time: 0, isGoal: false };
            entry.days[day][actName].checked = checked;
            entry.days[day][actName].time = time;
            if (isGoal !== undefined) entry.days[day][actName].isGoal = isGoal;
            saveEntries();
            renderTable();
            renderStats();
            renderCalendar();
            renderLongTermGoals();
        }

        function renderLanguageTabs() {
            const container = document.getElementById('languageTabs');
            container.innerHTML = '';
            languages.forEach(lang => {
                const tab = document.createElement('span');
                tab.className = `tab ${lang.id === currentLangId ? 'active' : ''}`;
                tab.textContent = lang.name;
                tab.dataset.id = lang.id;
                tab.onclick = () => { currentLangId = lang.id; renderAll(); };
                container.appendChild(tab);
            });
        }

        function renderTable() {
            if (!currentLangId) return;
            const lang = languages.find(l => l.id === currentLangId);
            if (!lang) return;
            const entry = getCurrentEntry();
            const days = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
            const unit = lang.timeUnit || 'min';
            const activeActivities = lang.activities.filter(act => act.active !== false);

            let thead = '<table><thead><tr><th>Actividad</th>';
            days.forEach(d => thead += `<th>${d}</th>`);
            thead += '<th>Total</th></thead>';
            document.getElementById('tableHeader').innerHTML = thead;

            let tbody = '<tbody>';
            activeActivities.forEach(act => {
                const actName = act.name;
                let totalAct = 0;
                let row = `<tr><td class="activity-cell">${act.name} (${act.dailyGoal} ${unit})</td>`;
                days.forEach(day => {
                    const cell = entry.days[day]?.[actName] || { checked: false, time: 0, isGoal: false };
                    totalAct += cell.time || 0;
                    const goalMet = (cell.time >= act.dailyGoal) ? 'goal-met' : '';
                    const markedClass = cell.checked ? 'checkbox-marked' : '';
                    const starIcon = cell.isGoal ? '★' : '☆';
                    row += `<td class="checkbox-cell ${goalMet} ${markedClass}">`;
                    row += `<input type="checkbox" class="day-check" data-day="${day}" data-act="${actName}" ${cell.checked ? 'checked' : ''}>`;
                    row += `<input type="number" class="time-input" data-day="${day}" data-act="${actName}" value="${cell.time || 0}" min="0" step="1">`;
                    row += `<button class="star-btn" data-day="${day}" data-act="${actName}" style="background:none; border:none; font-size:1.2rem; cursor:pointer; margin-left:4px; color:#f59e0b;">${starIcon}</button>`;
                    row += `</td>`;
                });
                row += `<td>${totalAct} ${unit}</td>`;
                row += `</tr>`;
                tbody += row;
            });
            tbody += '</tbody>';
            document.getElementById('tableBody').innerHTML = tbody;

            let totalGeneral = 0;
            let foot = '<tfoot><tr class="total-row"><td>Total día</td>';
            days.forEach(day => {
                let dayTotal = 0;
                activeActivities.forEach(act => { dayTotal += entry.days[day]?.[act.name]?.time || 0; });
                totalGeneral += dayTotal;
                foot += `<td>${dayTotal} ${unit}</td>`;
            });
            foot += `<td>${totalGeneral} ${unit}</td></tfoot>`;
            document.getElementById('tableFoot').innerHTML = foot;

            document.querySelectorAll('.day-check').forEach(cb => {
                cb.onchange = function() {
                    const day = this.dataset.day;
                    const actName = this.dataset.act;
                    const timeInput = document.querySelector(`.time-input[data-day="${day}"][data-act="${actName}"]`);
                    const time = parseInt(timeInput.value) || 0;
                    const cell = entry.days[day]?.[actName] || {};
                    updateCell(day, actName, this.checked, time, cell.isGoal);
                };
            });
            document.querySelectorAll('.time-input').forEach(inp => {
                inp.onchange = function() {
                    const day = this.dataset.day;
                    const actName = this.dataset.act;
                    const time = parseInt(this.value) || 0;
                    const check = document.querySelector(`.day-check[data-day="${day}"][data-act="${actName}"]`);
                    const cell = entry.days[day]?.[actName] || {};
                    updateCell(day, actName, check.checked, time, cell.isGoal);
                };
            });
            document.querySelectorAll('.star-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const day = btn.dataset.day;
                    const actName = btn.dataset.act;
                    const cell = entry.days[day]?.[actName] || { checked: false, time: 0, isGoal: false };
                    updateCell(day, actName, cell.checked, cell.time, !cell.isGoal);
                };
            });
            document.getElementById('weekRange').textContent = formatDateRange(currentWeekStart);
        }

        function getObjectivesMetMap(langId) {
            const objectivesMap = new Map();
            Object.keys(entries).forEach(key => {
                if (key.startsWith(langId + '_')) {
                    const entry = entries[key];
                    const weekStart = entry.weekStart;
                    const daysMap = {'Lun':0,'Mar':1,'Mié':2,'Jue':3,'Vie':4,'Sáb':5,'Dom':6};
                    Object.entries(entry.days).forEach(([dayName, acts]) => {
                        let hasGoal = false, allMet = true;
                        Object.values(acts).forEach(data => {
                            if (data.isGoal) {
                                hasGoal = true;
                                if (!data.checked) allMet = false;
                            }
                        });
                        if (hasGoal) {
                            const d = parseLocalDate(weekStart);
                            d.setDate(d.getDate() + daysMap[dayName]);
                            const dateStr = getLocalDateString(d);
                            objectivesMap.set(dateStr, allMet);
                        }
                    });
                }
            });
            return objectivesMap;
        }

        function renderStats() {
            if (!currentLangId) return;
            const lang = languages.find(l => l.id === currentLangId);
            const unit = lang.timeUnit || 'min';
            let dailyTotals = [], totalChecked = 0, daysWithChecked = new Set();

            Object.keys(entries).forEach(key => {
                if (key.startsWith(currentLangId + '_')) {
                    const entry = entries[key];
                    const weekStart = entry.weekStart;
                    const daysMap = {'Lun':0,'Mar':1,'Mié':2,'Jue':3,'Vie':4,'Sáb':5,'Dom':6};
                    Object.entries(entry.days).forEach(([dayName, acts]) => {
                        const total = Object.values(acts).reduce((acc, a) => acc + (a?.time || 0), 0);
                        const anyChecked = Object.values(acts).some(a => a?.checked);
                        if (anyChecked) {
                            const d = parseLocalDate(weekStart);
                            d.setDate(d.getDate() + daysMap[dayName]);
                            daysWithChecked.add(getLocalDateString(d));
                        }
                        Object.values(acts).forEach(a => { if (a?.checked) totalChecked++; });
                        if (total > 0) {
                            const d = parseLocalDate(weekStart);
                            d.setDate(d.getDate() + daysMap[dayName]);
                            dailyTotals.push({ date: getLocalDateString(d), total });
                        }
                    });
                }
            });
            dailyTotals.sort((a,b) => a.date.localeCompare(b.date));
            const avgDaily = dailyTotals.length ? (dailyTotals.reduce((s,d) => s + d.total, 0) / dailyTotals.length).toFixed(1) : 0;

            let currentStreak = 0, maxStreak = 0;
            if (dailyTotals.length) {
                let streak = 1;
                for (let i = 1; i < dailyTotals.length; i++) {
                    const prev = new Date(dailyTotals[i-1].date);
                    const curr = new Date(dailyTotals[i].date);
                    const diffDays = Math.round((curr - prev) / (1000*3600*24));
                    if (diffDays === 1) streak++;
                    else { maxStreak = Math.max(maxStreak, streak); streak = 1; }
                }
                maxStreak = Math.max(maxStreak, streak);
                const today = getLocalDateString(new Date());
                const todayIndex = dailyTotals.findIndex(d => d.date === today);
                if (todayIndex >= 0) {
                    let count = 1;
                    for (let i = todayIndex-1; i >= 0; i--) {
                        const prev = new Date(dailyTotals[i].date);
                        const next = new Date(dailyTotals[i+1].date);
                        if ((next - prev) / (1000*3600*24) === 1) count++;
                        else break;
                    }
                    currentStreak = count;
                }
            }
            const globalDailyGoal = lang.activities.reduce((s,a) => s + a.dailyGoal, 0);
            const daysWithMeta = dailyTotals.filter(d => d.total >= globalDailyGoal).length;
            const pctMeta = dailyTotals.length ? ((daysWithMeta / dailyTotals.length)*100).toFixed(1) : 0;

            const objectivesMap = getObjectivesMetMap(currentLangId);
            let objectivesMetCount = 0, currentObjStreak = 0, maxObjStreak = 0;
            const sortedObj = Array.from(objectivesMap.keys()).sort();
            let streak = 0;
            for (let i = 0; i < sortedObj.length; i++) {
                if (objectivesMap.get(sortedObj[i])) {
                    objectivesMetCount++;
                    streak++;
                    if (i === sortedObj.length-1 || !objectivesMap.get(sortedObj[i+1])) {
                        maxObjStreak = Math.max(maxObjStreak, streak);
                        streak = 0;
                    }
                } else {
                    maxObjStreak = Math.max(maxObjStreak, streak);
                    streak = 0;
                }
            }
            let todayObjStreak = 0;
            let checkDate = new Date();
            while (true) {
                const dateStr = getLocalDateString(checkDate);
                if (objectivesMap.get(dateStr) === true) {
                    todayObjStreak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else break;
            }
            const statsHtml = `
                <div class="stat-item"><span class="stat-value">${avgDaily}</span><br>Promedio diario (${unit})</div>
                <div class="stat-item"><span class="stat-value">${currentStreak}</span><br>Racha actual (días)</div>
                <div class="stat-item"><span class="stat-value">${maxStreak}</span><br>Máxima racha</div>
                <div class="stat-item"><span class="stat-value">${pctMeta}%</span><br>Días con meta de tiempo</div>
                <div class="stat-item"><span class="stat-value">${totalChecked}</span><br>Actividades marcadas</div>
                <div class="stat-item"><span class="stat-value">${daysWithChecked.size}</span><br>Días con marca</div>
                <div class="stat-item"><span class="stat-value">${objectivesMetCount}</span><br>Días con objetivo cumplido</div>
                <div class="stat-item"><span class="stat-value">${todayObjStreak}</span><br>Racha actual objetivos</div>
                <div class="stat-item"><span class="stat-value">${maxObjStreak}</span><br>Máx racha objetivos</div>
            `;
            document.getElementById('statsContainer').innerHTML = statsHtml;
        }

        function renderCalendar() {
            if (!currentLangId) return;
            const lang = languages.find(l => l.id === currentLangId);
            const unit = lang.timeUnit;
            const globalDailyGoal = lang.activities.reduce((s,a) => s + a.dailyGoal, 0);
            const firstDay = new Date(calendarYear, calendarMonth, 1);
            const lastDay = new Date(calendarYear, calendarMonth + 1, 0);
            const startOffset = (firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1);

            const dailyMap = new Map();
            Object.keys(entries).forEach(key => {
                if (key.startsWith(currentLangId + '_')) {
                    const entry = entries[key];
                    const weekStart = entry.weekStart;
                    const daysMap = {'Lun':0,'Mar':1,'Mié':2,'Jue':3,'Vie':4,'Sáb':5,'Dom':6};
                    Object.entries(entry.days).forEach(([dayName, acts]) => {
                        const total = Object.values(acts).reduce((acc, a) => acc + (a?.time || 0), 0);
                        if (total > 0) {
                            const d = parseLocalDate(weekStart);
                            d.setDate(d.getDate() + daysMap[dayName]);
                            dailyMap.set(getLocalDateString(d), total);
                        }
                    });
                }
            });
            const objectivesMap = getObjectivesMetMap(currentLangId);
            let calendarHtml = '';
            for (let i = 0; i < startOffset; i++) calendarHtml += '<div class="calendar-day"></div>';
            for (let d = 1; d <= lastDay.getDate(); d++) {
                const dateStr = `${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const total = dailyMap.get(dateStr) || 0;
                let className = 'calendar-day';
                if (total > 0) {
                    className += ' has-data';
                    if (total >= globalDailyGoal) className += ' goal-met-day';
                }
                const starIcon = objectivesMap.get(dateStr) ? '⭐' : '';
                calendarHtml += `<div class="${className}"><span class="calendar-day-number">${d}</span><br>${total} ${unit}<br>${starIcon}</div>`;
            }
            document.getElementById('calendarGrid').innerHTML = calendarHtml;
            const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            document.querySelector('.flex-row h2').innerHTML = `📅 ${monthNames[calendarMonth]} ${calendarYear}`;
        }

        function populateCalendarSelectors() {
            const monthSelect = document.getElementById('calendarMonthSelect');
            const yearSelect = document.getElementById('calendarYearSelect');
            const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            monthSelect.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = monthNames[i];
                if (i === calendarMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }
            const currentYear = new Date().getFullYear();
            yearSelect.innerHTML = '';
            for (let y = currentYear-2; y <= currentYear+2; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === calendarYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
        }

        function renderLongTermGoals() {
            let html = '';
            languages.forEach(lang => {
                let totalAcum = 0;
                Object.keys(entries).forEach(key => {
                    if (key.startsWith(lang.id + '_')) {
                        const entry = entries[key];
                        Object.values(entry.days).forEach(acts => {
                            Object.values(acts).forEach(a => { if (a) totalAcum += a.time; });
                        });
                    }
                });
                const metaObj = lang.longTermGoal || { amount: 0, unit: lang.timeUnit };
                const metaValor = metaObj.amount;
                const metaUnidad = metaObj.unit;
                let totalConvertido = totalAcum;
                if (lang.timeUnit === 'min' && metaUnidad === 'h') totalConvertido = totalAcum / 60;
                else if (lang.timeUnit === 'h' && metaUnidad === 'min') totalConvertido = totalAcum * 60;
                const porcentaje = metaValor > 0 ? Math.min(100, (totalConvertido / metaValor) * 100) : 0;
                html += `<div class="goal-card">
                    <h4>${lang.name}</h4>
                    <p>${totalConvertido.toFixed(1)} ${metaUnidad} / ${metaValor} ${metaUnidad}</p>
                    <div class="progress-bar"><div class="progress-fill" style="width:${porcentaje}%;">${porcentaje.toFixed(1)}%</div></div>
                </div>`;
            });
            document.getElementById('longTermGoals').innerHTML = html;
        }

        function renderActivitiesConfig() {
            if (!currentLangId) return;
            const lang = languages.find(l => l.id === currentLangId);
            let html = `<div style="margin-bottom:20px; padding:10px; background:#e6f0fa; border-radius:12px;">
                <label><strong>Meta a largo plazo:</strong> 
                    <input type="number" id="longTermGoalInput" value="${lang.longTermGoal?.amount || 0}" min="0" step="1" style="width:100px;">
                    <select id="longTermGoalUnit">
                        <option value="min" ${lang.longTermGoal?.unit === 'min' ? 'selected' : ''}>Minutos</option>
                        <option value="h" ${lang.longTermGoal?.unit === 'h' ? 'selected' : ''}>Horas</option>
                    </select>
                </label>
                <button id="saveLongTermGoalBtn" class="small secondary">Guardar meta</button>
            </div>`;
            lang.activities.forEach(act => {
                const archivedClass = (act.active === false) ? 'archived' : '';
                html += `<div class="activity-config ${archivedClass}" data-act-name="${act.name}">
                    <input type="text" class="act-name" value="${act.name}" style="flex:2;">
                    <label>Meta diaria: <input type="number" class="act-dailyGoal" value="${act.dailyGoal}" min="0" step="1" style="width:80px;"></label>
                    <button class="small secondary archive-act" title="Archivar/ocultar">📦</button>
                    <button class="small warning delete-act-data" title="Borrar todos los registros de esta actividad">🗑️ Datos</button>
                    <button class="small warning remove-act" title="Eliminar actividad por completo">✕</button>
                </div>`;
            });
            document.getElementById('activitiesConfig').innerHTML = html;
            document.getElementById('saveLongTermGoalBtn')?.addEventListener('click', () => {
                lang.longTermGoal = { amount: parseInt(document.getElementById('longTermGoalInput').value) || 0, unit: document.getElementById('longTermGoalUnit').value };
                saveLanguages();
                renderLongTermGoals();
                renderActivitiesConfig();
                alert('Meta a largo plazo guardada');
            });
            document.querySelectorAll('.archive-act').forEach(btn => {
                btn.addEventListener('click', () => {
                    const actName = btn.closest('.activity-config').dataset.actName;
                    const activity = lang.activities.find(a => a.name === actName);
                    if (activity) { activity.active = !activity.active; saveLanguages(); renderActivitiesConfig(); renderTable(); renderStats(); renderCalendar(); renderLongTermGoals(); }
                });
            });
            document.querySelectorAll('.delete-act-data').forEach(btn => {
                btn.addEventListener('click', () => {
                    const actName = btn.closest('.activity-config').dataset.actName;
                    if (confirm(`¿Borrar TODOS los registros de "${actName}"?`)) {
                        Object.keys(entries).forEach(key => {
                            if (key.startsWith(currentLangId + '_')) {
                                Object.values(entries[key].days).forEach(dayObj => { if (dayObj[actName]) delete dayObj[actName]; });
                            }
                        });
                        saveEntries();
                        renderTable(); renderStats(); renderCalendar(); renderLongTermGoals();
                        alert(`Registros de "${actName}" eliminados.`);
                    }
                });
            });
            document.querySelectorAll('.remove-act').forEach(btn => {
                btn.addEventListener('click', () => {
                    const actName = btn.closest('.activity-config').dataset.actName;
                    if (confirm(`¿Eliminar la actividad "${actName}"? Se perderán todos los registros.`)) {
                        const index = lang.activities.findIndex(a => a.name === actName);
                        if (index !== -1) {
                            lang.activities.splice(index, 1);
                            Object.keys(entries).forEach(key => {
                                if (key.startsWith(currentLangId + '_')) {
                                    Object.values(entries[key].days).forEach(dayObj => { if (dayObj[actName]) delete dayObj[actName]; });
                                }
                            });
                            saveLanguages(); saveEntries();
                            renderActivitiesConfig(); renderTable(); renderStats(); renderCalendar(); renderLongTermGoals();
                        }
                    }
                });
            });
        }

        // Limpieza total (sin cambios funcionales, solo usa las nuevas funciones de fecha si es necesario)
        function cleanEmptyWeeks() {
            let removed = 0;
            for (let key in entries) {
                let has = false;
                for (let day in entries[key].days) {
                    for (let act in entries[key].days[day]) {
                        if (entries[key].days[day][act]?.time > 0) { has = true; break; }
                    }
                    if (has) break;
                }
                if (!has) { delete entries[key]; removed++; }
            }
            return removed;
        }
        function cleanOrphanEntries() {
            const ids = new Set(languages.map(l => l.id));
            let removed = 0;
            for (let key in entries) {
                if (!ids.has(key.split('_')[0])) { delete entries[key]; removed++; }
            }
            return removed;
        }
        function cleanObsoleteActivities() {
            let removed = 0;
            languages.forEach(lang => {
                const valid = new Set(lang.activities.map(a => a.name));
                Object.keys(entries).forEach(key => {
                    if (key.startsWith(lang.id + '_')) {
                        Object.values(entries[key].days).forEach(dayObj => {
                            Object.keys(dayObj).forEach(actName => {
                                if (!valid.has(actName)) { delete dayObj[actName]; removed++; }
                            });
                        });
                    }
                });
            });
            return removed;
        }
        function fullClean() {
            let msg = '';
            const a = cleanObsoleteActivities(); if (a) msg += `Actividades obsoletas: ${a} registros.\n`;
            const b = cleanEmptyWeeks(); if (b) msg += `Semanas vacías: ${b} eliminadas.\n`;
            const c = cleanOrphanEntries(); if (c) msg += `Semanas huérfanas: ${c} eliminadas.\n`;
            if (a+b+c === 0) alert('No se encontraron residuos.');
            else { saveEntries(); alert(`Limpieza total:\n${msg}Base de datos depurada.`); renderAll(); }
        }

        function checkAndShowReminder() {
            const today = getLocalDateString(new Date());
            const pending = [];
            languages.forEach(lang => {
                let found = false;
                Object.keys(entries).forEach(key => {
                    if (key.startsWith(lang.id + '_')) {
                        const entry = entries[key];
                        const weekStart = entry.weekStart;
                        const daysMap = {'Lun':0,'Mar':1,'Mié':2,'Jue':3,'Vie':4,'Sáb':5,'Dom':6};
                        for (let dayName in entry.days) {
                            const d = parseLocalDate(weekStart);
                            d.setDate(d.getDate() + daysMap[dayName]);
                            if (getLocalDateString(d) === today) {
                                const hasTime = Object.values(entry.days[dayName]).some(cell => (cell.time || 0) > 0);
                                if (hasTime) found = true;
                            }
                        }
                    }
                });
                if (!found) pending.push(lang.name);
            });
            const panel = document.getElementById('reminderPanel');
            const text = document.getElementById('reminderText');
            if (pending.length) {
                const links = pending.map(lang => `<a href="#" class="reminder-lang" data-lang="${lang}">${lang}</a>`).join(', ');
                text.innerHTML = `No has registrado actividad hoy en: ${links}. ¡Registra tu progreso!`;
                panel.style.display = 'block';
                document.querySelectorAll('.reminder-lang').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const lang = languages.find(l => l.name === link.dataset.lang);
                        if (lang) { currentLangId = lang.id; renderAll(); }
                    });
                });
            } else panel.style.display = 'none';
        }

        function renderAll() {
            renderLanguageTabs();
            renderTable();
            renderStats();
            renderCalendar();
            renderLongTermGoals();
            renderActivitiesConfig();
            document.getElementById('currentLangName').textContent = languages.find(l => l.id === currentLangId)?.name || '';
            document.getElementById('timeUnitSelect').value = languages.find(l => l.id === currentLangId)?.timeUnit || 'min';
            checkAndShowReminder();
            populateCalendarSelectors();
        }

        // Eventos
        document.getElementById('prevWeekBtn').onclick = () => {
            const d = parseLocalDate(currentWeekStart);
            d.setDate(d.getDate() - 7);
            currentWeekStart = getMonday(d);
            renderAll();
        };
        document.getElementById('nextWeekBtn').onclick = () => {
            const d = parseLocalDate(currentWeekStart);
            d.setDate(d.getDate() + 7);
            currentWeekStart = getMonday(d);
            renderAll();
        };
        document.getElementById('weekPicker').onchange = (e) => {
            if (e.target.value) currentWeekStart = getMonday(new Date(e.target.value));
            renderAll();
        };
        document.getElementById('goToTodayBtn').onclick = () => {
            currentWeekStart = getMonday(new Date());
            renderAll();
        };
        document.getElementById('calendarMonthSelect').addEventListener('change', (e) => { calendarMonth = parseInt(e.target.value); renderCalendar(); populateCalendarSelectors(); });
        document.getElementById('calendarYearSelect').addEventListener('change', (e) => { calendarYear = parseInt(e.target.value); renderCalendar(); populateCalendarSelectors(); });
        document.getElementById('syncCalendarBtn').addEventListener('click', () => {
            const d = parseLocalDate(currentWeekStart);
            calendarYear = d.getFullYear();
            calendarMonth = d.getMonth();
            populateCalendarSelectors();
            renderCalendar();
        });
        document.getElementById('addLangBtn').onclick = () => {
            const name = prompt('Nombre del nuevo idioma:');
            if (!name) return;
            languages.push({ id: generateId(), name, activities: [{ name: 'Actividad', dailyGoal: 30, active: true }], longTermGoal: { amount: 100, unit: 'min' }, timeUnit: 'min' });
            currentLangId = languages[languages.length-1].id;
            saveLanguages();
            renderAll();
        };
        document.getElementById('addActivityBtn').onclick = () => {
            if (!currentLangId) return;
            languages.find(l => l.id === currentLangId).activities.push({ name: 'Nueva', dailyGoal: 0, active: true });
            renderActivitiesConfig();
        };
        document.getElementById('saveActivitiesBtn').onclick = () => {
            if (!currentLangId) return;
            const lang = languages.find(l => l.id === currentLangId);
            const newActs = [];
            document.querySelectorAll('.activity-config').forEach(div => {
                const name = div.querySelector('.act-name').value.trim();
                const daily = parseInt(div.querySelector('.act-dailyGoal').value) || 0;
                if (name) newActs.push({ name, dailyGoal: daily, active: lang.activities.find(a => a.name === name)?.active ?? true });
            });
            lang.activities = newActs;
            lang.timeUnit = document.getElementById('timeUnitSelect').value;
            saveLanguages();
            alert('Actividades guardadas. Si renombraste alguna, los datos históricos no migran.');
            renderAll();
        };
        document.getElementById('deleteLangBtn').addEventListener('click', () => {
            if (!languages.length) return alert('No hay idiomas.');
            let msg = 'Selecciona número:\n';
            languages.forEach((l,i)=>msg+=`${i+1}. ${l.name}\n`);
            const idx = parseInt(prompt(msg))-1;
            if (isNaN(idx)||idx<0||idx>=languages.length) return alert('Inválido');
            const lang = languages[idx];
            if (confirm(`¿Eliminar "${lang.name}"?`)) {
                languages.splice(idx,1);
                Object.keys(entries).forEach(k=>{if(k.startsWith(lang.id+'_'))delete entries[k];});
                if (currentLangId === lang.id) currentLangId = languages.length?languages[0].id:null;
                saveLanguages(); saveEntries(); renderAll();
            }
        });
        document.getElementById('exportBtn').onclick = () => {
            const data = { languages, entries };
            const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'idiomas_backup.json';
            a.click();
            URL.revokeObjectURL(a.href);
        };
        document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
        document.getElementById('importFile').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.languages && data.entries) {
                        languages = data.languages;
                        entries = data.entries;
                        saveLanguages(); saveEntries();
                        if (languages.length) currentLangId = languages[0].id;
                        renderAll();
                        alert('Importación exitosa');
                    } else throw new Error('Formato inválido');
                } catch(ex) { alert('Error al importar: '+ex); }
            };
            reader.readAsText(file);
        };
        document.getElementById('fullCleanBtn').addEventListener('click', fullClean);

        loadData();
        renderAll();
    })();
    document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
</body>
